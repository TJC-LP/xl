name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # The plugin manifest must carry the same version as the build's PUBLISH_VERSION fallback:
  # /release-prep bumps both, and a drift here ships a skill that claims the wrong xl. The xl-cli
  # skill's `Requires xl >= X` must name that same version too, unless the skill carries the
  # `<!-- unreleased-contract -->` marker: that marker says the skill documents a contract the
  # latest release does not have yet and points agents at the from-source install, and
  # /release-prep removes it when the release ships (a marker left behind fails the gate).
  plugin-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: plugin.json version equals build.mill
        run: |
          build_version=$(sed -n 's/.*getOrElse("PUBLISH_VERSION", *"\([^"]*\)").*/\1/p' build.mill)
          plugin_version=$(jq -r .version plugin/.claude-plugin/plugin.json)
          echo "build.mill: $build_version  plugin.json: $plugin_version"
          test -n "$build_version" || { echo "no PUBLISH_VERSION fallback found in build.mill"; exit 1; }
          test "$build_version" = "$plugin_version" || {
            echo "plugin/.claude-plugin/plugin.json version ($plugin_version) differs from build.mill ($build_version)"
            exit 1
          }

      - name: xl-cli skill's Requires version equals plugin.json, or the skill is marked unreleased
        run: |
          skill=plugin/skills/xl-cli/SKILL.md
          plugin_version=$(jq -r .version plugin/.claude-plugin/plugin.json)
          skill_version=$(grep -oE 'Requires xl >= [0-9]+\.[0-9]+\.[0-9]+' "$skill" | head -1 | sed 's/Requires xl >= //')
          echo "plugin.json: $plugin_version  $skill: Requires xl >= ${skill_version:-<none>}"
          test -n "$skill_version" || { echo "no 'Requires xl >= X.Y.Z' line found in $skill"; exit 1; }
          if grep -qF '<!-- unreleased-contract -->' "$skill"; then
            test "$skill_version" != "$plugin_version" || {
              echo "$skill still carries the unreleased-contract marker but Requires the released $plugin_version: remove the marker and its note"
              exit 1
            }
            echo "$skill documents the unreleased $skill_version contract (marker present)"
          else
            test "$skill_version" = "$plugin_version" || {
              echo "$skill requires xl >= $skill_version but plugin.json is $plugin_version: bump one, or add the <!-- unreleased-contract --> marker with the from-source install note"
              exit 1
            }
          fi

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: coursier/setup-action@v1
        with:
          jvm: temurin:25

      - name: Cache Coursier
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/coursier
            ~/.ivy2/cache
          key: ${{ runner.os }}-coursier-${{ hashFiles('**/build.mill', '**/.scalafmt.conf', '**/.scalafix.conf') }}
          restore-keys: |
            ${{ runner.os }}-coursier-

      # Note: out/ intentionally not cached - stale artifacts cause
      # build issues and cache invalidation problems between Mill versions
      - name: Cache Mill
        uses: actions/cache@v4
        with:
          path: |
            ~/.mill
          key: ${{ runner.os }}-mill-${{ hashFiles('**/build.mill') }}
          restore-keys: |
            ${{ runner.os }}-mill-

      - name: Check Formatting
        run: ./mill mill.scalalib.scalafmt.ScalafmtModule/checkFormatAll __.sources

      - name: Compile
        run: ./mill __.compile

      - name: Test
        run: ./mill -i __.test

  examples:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK + scala-cli
        uses: coursier/setup-action@v1
        with:
          jvm: temurin:25
          apps: scala-cli

      - name: Cache Coursier
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/coursier
            ~/.ivy2/cache
          key: ${{ runner.os }}-coursier-${{ hashFiles('**/build.mill', '**/.scalafmt.conf', '**/.scalafix.conf') }}
          restore-keys: |
            ${{ runner.os }}-coursier-

      - name: Cache Mill
        uses: actions/cache@v4
        with:
          path: |
            ~/.mill
          key: ${{ runner.os }}-mill-${{ hashFiles('**/build.mill') }}
          restore-keys: |
            ${{ runner.os }}-mill-

      # Compile every examples/*.sc against the local build and run the curated subset.
      # This is the anti-rot guarantee for examples and the xl-scripting skill snippets.
      - name: Verify examples
        run: ./scripts/test-examples.sh

  # The agent-visible contract of `xl` as its own check (GH-592). The golden corpus, the generated
  # reference pages and the code vocabulary run explicitly, so a golden diff fails THIS job with the
  # unified diff in its log instead of somewhere inside the full suite; then the assembly JAR is
  # driven the way an agent drives it by scripts/smoke-cli-contract.sh — `--help`, `sheets`,
  # `view --json`, `schema --json`, `lint`, and two failures whose envelopes must carry the error
  # code — against the checked-in fixtures. release.yml runs the same script against every native
  # binary. Deliberately no `needs: build`: a golden diff also fails `build`'s full suite, and a
  # dependent job would be skipped instead of showing the diff. The cost is a second compile of the
  # xl-cli dependency graph in parallel with `build`, hence the timeout.
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: coursier/setup-action@v1
        with:
          jvm: temurin:25

      - name: Cache Coursier
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/coursier
            ~/.ivy2/cache
          key: ${{ runner.os }}-coursier-${{ hashFiles('**/build.mill', '**/.scalafmt.conf', '**/.scalafix.conf') }}
          restore-keys: |
            ${{ runner.os }}-coursier-

      - name: Cache Mill
        uses: actions/cache@v4
        with:
          path: |
            ~/.mill
          key: ${{ runner.os }}-mill-${{ hashFiles('**/build.mill') }}
          restore-keys: |
            ${{ runner.os }}-mill-

      # A failing golden prints `golden '<name>' differs from the recorded contract` followed by the
      # unified diff (--- expected / +++ actual); re-record deliberately with XL_UPDATE_GOLDEN=1 and
      # add a CHANGELOG line. DocsGenSpec does the same for docs/reference/generated/*.md
      # (XL_UPDATE_DOCS=1); ContractSpec holds the code tables against the vocabulary and the corpus.
      - name: Golden corpus, generated reference, code vocabulary
        run: >-
          ./mill -i xl-cli.test.testOnly
          com.tjclp.xl.cli.contract.GoldenSpec
          com.tjclp.xl.cli.contract.DocsGenSpec
          com.tjclp.xl.cli.contract.ContractSpec

      - name: Build CLI JAR
        run: ./mill -i xl-cli.assembly

      # `-`: the expected version is the artifact's own. With PUBLISH_VERSION unset that is build.mill's
      # fallback, and the script holds every other place the JAR prints a version to what --version
      # printed — the property the contract cares about, without a second source to drift from.
      - name: Smoke test CLI JAR
        run: scripts/smoke-cli-contract.sh - java -jar out/xl-cli/assembly.dest/out.jar
