name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # The plugin manifest must carry the same version as the build's PUBLISH_VERSION fallback:
  # /release-prep bumps both, and a drift here ships a skill that claims the wrong xl.
  plugin-version:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: plugin.json version equals build.mill
        run: |
          build_version=$(sed -n 's/.*getOrElse("PUBLISH_VERSION", *"\([^"]*\)").*/\1/p' build.mill)
          plugin_version=$(jq -r .version plugin/.claude-plugin/plugin.json)
          echo "build.mill: $build_version  plugin.json: $plugin_version"
          test -n "$build_version" || { echo "no PUBLISH_VERSION fallback found in build.mill"; exit 1; }
          test "$build_version" = "$plugin_version" || {
            echo "plugin/.claude-plugin/plugin.json version ($plugin_version) differs from build.mill ($build_version)"
            exit 1
          }

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: coursier/setup-action@v1
        with:
          jvm: temurin:25

      - name: Cache Coursier
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/coursier
            ~/.ivy2/cache
          key: ${{ runner.os }}-coursier-${{ hashFiles('**/build.mill', '**/.scalafmt.conf', '**/.scalafix.conf') }}
          restore-keys: |
            ${{ runner.os }}-coursier-

      # Note: out/ intentionally not cached - stale artifacts cause
      # build issues and cache invalidation problems between Mill versions
      - name: Cache Mill
        uses: actions/cache@v4
        with:
          path: |
            ~/.mill
          key: ${{ runner.os }}-mill-${{ hashFiles('**/build.mill') }}
          restore-keys: |
            ${{ runner.os }}-mill-

      - name: Check Formatting
        run: ./mill mill.scalalib.scalafmt.ScalafmtModule/checkFormatAll __.sources

      - name: Compile
        run: ./mill __.compile

      - name: Test
        run: ./mill -i __.test

  examples:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK + scala-cli
        uses: coursier/setup-action@v1
        with:
          jvm: temurin:25
          apps: scala-cli

      - name: Cache Coursier
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/coursier
            ~/.ivy2/cache
          key: ${{ runner.os }}-coursier-${{ hashFiles('**/build.mill', '**/.scalafmt.conf', '**/.scalafix.conf') }}
          restore-keys: |
            ${{ runner.os }}-coursier-

      - name: Cache Mill
        uses: actions/cache@v4
        with:
          path: |
            ~/.mill
          key: ${{ runner.os }}-mill-${{ hashFiles('**/build.mill') }}
          restore-keys: |
            ${{ runner.os }}-mill-

      # Compile every examples/*.sc against the local build and run the curated subset.
      # This is the anti-rot guarantee for examples and the xl-scripting skill snippets.
      - name: Verify examples
        run: ./scripts/test-examples.sh
